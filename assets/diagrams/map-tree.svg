<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" font-family="SFMono-Regular, Consolas, monospace" font-size="12">
  <rect width="480" height="220" fill="#0d1117" rx="8"/>

  <!-- Root node (Black) -->
  <rect x="175" y="20" width="130" height="50" fill="#21262d" stroke="#484f58" stroke-width="2" rx="6"/>
  <text x="240" y="42" fill="#e6edf3" text-anchor="middle" font-weight="bold">"Carol"</text>
  <text x="240" y="60" fill="#8b949e" text-anchor="middle" font-size="11">score = 90  ■ Black</text>

  <!-- Left node (Black) -->
  <rect x="50" y="110" width="130" height="50" fill="#21262d" stroke="#484f58" stroke-width="2" rx="6"/>
  <text x="115" y="132" fill="#e6edf3" text-anchor="middle" font-weight="bold">"Alice"</text>
  <text x="115" y="150" fill="#8b949e" text-anchor="middle" font-size="11">score = 95  ■ Black</text>

  <!-- Right node (Red) -->
  <rect x="300" y="110" width="130" height="50" fill="#2d1117" stroke="#8b2f2f" stroke-width="2" rx="6"/>
  <text x="365" y="132" fill="#e6edf3" text-anchor="middle" font-weight="bold">"Dave"</text>
  <text x="365" y="150" fill="#f85149" text-anchor="middle" font-size="11">score = 82  ● Red</text>

  <!-- Edges root → left -->
  <line x1="205" y1="70" x2="155" y2="110" stroke="#484f58" stroke-width="1.5"/>
  <!-- Edges root → right -->
  <line x1="275" y1="70" x2="325" y2="110" stroke="#484f58" stroke-width="1.5"/>

  <!-- Sorted order annotation -->
  <text x="240" y="190" fill="#8b949e" font-size="11" text-anchor="middle">In-order traversal: Alice → Carol → Dave  (sorted by key)</text>
  <text x="240" y="208" fill="#6e7681" font-size="10" text-anchor="middle">Red-black tree maintains O(log n) height invariant</text>
</svg>
