<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" font-family="SFMono-Regular, Consolas, monospace" font-size="13">
  <!-- Background -->
  <rect width="580" height="200" fill="#0d1117" rx="8"/>

  <!-- Labels -->
  <text x="80" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Stack</text>
  <text x="380" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Heap</text>

  <!-- Stack object box -->
  <rect x="20" y="45" width="120" height="110" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <!-- Fields -->
  <rect x="20" y="45" width="120" height="35" fill="#21262d" rx="4 4 0 0"/>
  <text x="80" y="68" fill="#58a6ff" text-anchor="middle" font-size="12">ptr</text>
  <rect x="20" y="80" width="120" height="37" fill="#161b22"/>
  <text x="80" y="103" fill="#e6edf3" text-anchor="middle" font-size="12">size = 3</text>
  <rect x="20" y="117" width="120" height="38" fill="#21262d" rx="0 0 4 4"/>
  <text x="80" y="141" fill="#e6edf3" text-anchor="middle" font-size="12">capacity = 6</text>

  <!-- Arrow from ptr to heap -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <line x1="140" y1="63" x2="248" y2="83" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Heap buffer -->
  <!-- Used cells -->
  <rect x="252" y="60" width="60" height="55" fill="#0d2848" stroke="#388bfd" stroke-width="1.5"/>
  <text x="282" y="93" fill="#58a6ff" text-anchor="middle" font-size="13" font-weight="bold">1</text>

  <rect x="312" y="60" width="60" height="55" fill="#0d2848" stroke="#388bfd" stroke-width="1.5"/>
  <text x="342" y="93" fill="#58a6ff" text-anchor="middle" font-size="13" font-weight="bold">2</text>

  <rect x="372" y="60" width="60" height="55" fill="#0d2848" stroke="#388bfd" stroke-width="1.5"/>
  <text x="402" y="93" fill="#58a6ff" text-anchor="middle" font-size="13" font-weight="bold">3</text>

  <!-- Unused cells -->
  <rect x="432" y="60" width="40" height="55" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="472" y="60" width="40" height="55" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="512" y="60" width="40" height="55" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Index labels -->
  <text x="282" y="128" fill="#6e7681" text-anchor="middle" font-size="11">[0]</text>
  <text x="342" y="128" fill="#6e7681" text-anchor="middle" font-size="11">[1]</text>
  <text x="402" y="128" fill="#6e7681" text-anchor="middle" font-size="11">[2]</text>

  <!-- "unused capacity" label -->
  <text x="490" y="55" fill="#6e7681" font-size="11" text-anchor="middle">unused</text>
  <line x1="452" y1="58" x2="550" y2="58" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Caption -->
  <text x="290" y="175" fill="#8b949e" font-size="11" text-anchor="middle">std::vector internal layout — ptr, size, capacity</text>
</svg>
