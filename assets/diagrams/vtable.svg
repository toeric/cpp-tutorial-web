<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="SFMono-Regular, Consolas, monospace" font-size="12">
  <rect width="600" height="260" fill="#0d1117" rx="8"/>

  <!-- Title labels -->
  <text x="80"  y="25" fill="#8b949e" font-size="11" text-anchor="middle">Circle object</text>
  <text x="290" y="25" fill="#8b949e" font-size="11" text-anchor="middle">Square object</text>
  <text x="130" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Circle vtable</text>
  <text x="430" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Square vtable</text>

  <!-- Circle object -->
  <rect x="20" y="35" width="120" height="35" fill="#21262d" stroke="#30363d" stroke-width="1.5" rx="4 4 0 0"/>
  <text x="80" y="57" fill="#58a6ff" text-anchor="middle">vptr</text>
  <rect x="20" y="70" width="120" height="35" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="0 0 4 4"/>
  <text x="80" y="93" fill="#e6edf3" text-anchor="middle">radius = 5.0</text>

  <!-- Square object -->
  <rect x="230" y="35" width="120" height="35" fill="#21262d" stroke="#30363d" stroke-width="1.5" rx="4 4 0 0"/>
  <text x="290" y="57" fill="#58a6ff" text-anchor="middle">vptr</text>
  <rect x="230" y="70" width="120" height="35" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="0 0 4 4"/>
  <text x="290" y="93" fill="#e6edf3" text-anchor="middle">side = 3.0</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- vptr arrows — from object to vtable -->
  <path d="M80,70 Q80,130 70,185" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <path d="M290,70 Q360,130 380,185" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>

  <!-- Circle vtable -->
  <rect x="20" y="185" width="220" height="32" fill="#0d2848" stroke="#388bfd" stroke-width="1.5" rx="4 4 0 0"/>
  <text x="130" y="205" fill="#58a6ff" text-anchor="middle">[0] draw → Circle::draw</text>
  <rect x="20" y="217" width="220" height="28" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
  <text x="130" y="235" fill="#58a6ff" text-anchor="middle">[1] area → Circle::area</text>
  <rect x="20" y="245" width="220" height="8" fill="#21262d" stroke="#388bfd" stroke-width="1" rx="0 0 4 4"/>

  <!-- Square vtable -->
  <rect x="360" y="185" width="220" height="32" fill="#0f2a14" stroke="#238636" stroke-width="1.5" rx="4 4 0 0"/>
  <text x="470" y="205" fill="#3fb950" text-anchor="middle">[0] draw → Square::draw</text>
  <rect x="360" y="217" width="220" height="28" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="470" y="235" fill="#3fb950" text-anchor="middle">[1] area → Square::area</text>
  <rect x="360" y="245" width="220" height="8" fill="#21262d" stroke="#238636" stroke-width="1" rx="0 0 4 4"/>

  <text x="300" y="256" fill="#6e7681" font-size="10" text-anchor="middle">Each class has one vtable; each object has one vptr</text>
</svg>
